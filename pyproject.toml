[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-research"
version = "0.1.0"
description = "MCP server for academic bibliographic search across arXiv, Semantic Scholar, and other sources"
authors = [{name = "User", email = "user@example.com"}]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "feedparser>=6.0.0",
    "python-dateutil>=2.8.0",
    "beautifulsoup4>=4.12.0",
    "pyzotero>=1.6.12",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-research = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "/.git",
    "/.pytest_cache",
    "/__pycache__",
    "*.pyc",
    "*.pyo",
]

[tool.black]
line-length = 80

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]